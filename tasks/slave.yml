---
- name: Create spark slave systemd service file
  ansible.builtin.template:
    mode: '0644'
    src: systemd/spark-slave.service.j2
    dest: /etc/systemd/system/spark-slave.service
  notify:
    - Reload systemd
    - Restart spark-slave

- name: Start spark slave
  ansible.builtin.service:
    name: spark-slave
    state: started
    enabled: true
